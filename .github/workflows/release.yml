name: Build & Release

# Every push builds Windows and Linux packages (downloadable from the run's "Artifacts").
# Pushing a tag like v0.1.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -File package.ps1 -Version
          - os: ubuntu-latest
            script: bash package.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: ${{ matrix.script }} ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: DiamondRushRecomp-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DiamondRushRecomp ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
